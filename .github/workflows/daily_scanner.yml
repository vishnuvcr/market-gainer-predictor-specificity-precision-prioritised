name: NSE Daily Stock Surge ML Scanner

on:
  schedule:
    # Runs Monday through Friday at 11:30 UTC (5:00 PM IST - after NSE market close)
    - cron: '30 11 * * 1-5'
  workflow_dispatch:
    inputs:
      limit_tickers:
        description: 'Limit number of tickers (optional, e.g. 20 for fast test)'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages-and-scanner'
  cancel-in-progress: false

jobs:
  run-scanner:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute ML Stock Surge Pipeline
        run: |
          if [ -n "${{ github.event.inputs.limit_tickers }}" ]; then
            python main.py --limit ${{ github.event.inputs.limit_tickers }}
          else
            python main.py
          fi

      - name: Commit and Push Updated Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/ strategies/
          if git diff --staged --quiet; then
            echo "No data changes detected to commit."
          else
            git commit -m "Auto: Update NSE Surge ML Results [$(date -u +'%Y-%m-%d %H:%M UTC')]"
            git push
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
