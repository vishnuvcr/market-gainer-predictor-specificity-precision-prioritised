name: NSE Strategy Walk-Forward Backtester

on:
  workflow_dispatch:
    inputs:
      limit_tickers:
        description: 'Limit number of tickers (e.g. 50 or 100 for fast backtest, leave blank for full)'
        required: false
        default: '50'
      initial_capital:
        description: 'Initial Capital in INR (default: 100000 = 1 Lakh)'
        required: false
        default: '100000'
      max_capital_per_trade:
        description: 'Maximum Capital per Trade including charges (default: 20000)'
        required: false
        default: '20000'
      warmup_days:
        description: 'Warmup training days before backtest begins (default: 120)'
        required: false
        default: '120'
      retrain_days:
        description: 'Retrain frequency in trading days (default: 10)'
        required: false
        default: '10'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'backtest-job'
  cancel-in-progress: false

jobs:
  run-backtest:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Walk-Forward Backtest
        run: |
          CMD="python -u backtest.py --capital ${{ github.event.inputs.initial_capital }} --max-per-trade ${{ github.event.inputs.max_capital_per_trade }} --warmup-days ${{ github.event.inputs.warmup_days }} --retrain-days ${{ github.event.inputs.retrain_days }}"
          if [ -n "${{ github.event.inputs.limit_tickers }}" ]; then
            CMD="$CMD --limit ${{ github.event.inputs.limit_tickers }}"
          fi
          echo "Running command: $CMD"
          eval $CMD

      - name: Upload Trade Logs as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backtest-reports
          path: |
            backtest_trade_log.csv
            backtest_daily_pnl.csv
            docs/data/backtest_summary.json

      - name: Commit and Push Backtest Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/ backtest_trade_log.csv backtest_daily_pnl.csv
          if git diff --staged --quiet; then
            echo "No backtest data changes to commit."
          else
            git commit -m "Auto: Update Walk-Forward Backtest Results [$(date -u +'%Y-%m-%d %H:%M UTC')]"
            git push
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        
